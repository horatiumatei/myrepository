# Arhitectura Llama custom: ~210M parametri
# Llama este mai modern si mult mai rapid decat GPT-2 datorita GQA si SDPA

vocab_size: 32000
hidden_size: 1024
num_hidden_layers: 16
num_attention_heads: 16
num_key_value_heads: 4    # Grouped Query Attention (GQA) -> salveaza masiv VRAM si creste viteza
intermediate_size: 2752   # SwiGLU FFN
max_position_embeddings: 2048
rms_norm_eps: 1.0e-5
initializer_range: 0.02
use_cache: false          # Dezactivat in antrenare
bos_token_id: 1
eos_token_id: 2
pad_token_id: 0
